[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-sr"
dynamic = ["version"]
description = "Observation-consistent super-resolution of Sentinel-2 imagery to a 2 m grid"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "CC0-1.0"}
authors = [{name = "Sharadh Naidu", email = "sharadhanaidu@rvu.edu.in"}]
keywords = ["sentinel-2", "super-resolution", "remote-sensing", "earth-observation", "deep-learning", "mamba", "geotiff"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Typing :: Typed",
]
dependencies = [
  "torch>=1.13",
  "numpy>=1.21",
  "safetensors>=0.3",
  "rasterio>=1.3",
  "affine>=2.3",
  "scipy>=1.7",
  "rich>=12",
]

[project.optional-dependencies]
stac = ["pystac-client>=0.6"]
xarray = ["xarray>=0.20"]
cuda = ["mamba-ssm>=1.1"]
all = ["pystac-client>=0.6", "xarray>=0.20"]
test = ["pytest>=7", "pytest-cov>=4", "xarray>=0.20"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.24"]

[project.urls]
Homepage = "https://github.com/SharadhNaidu/synapse-sr"
Documentation = "https://sharadhnaidu.github.io/synapse-sr/"
Source = "https://github.com/SharadhNaidu/synapse-sr"
Issues = "https://github.com/SharadhNaidu/synapse-sr/issues"
Weights = "https://huggingface.co/SharadhNaiduTrains/synapse-sr"

[project.scripts]
synapse-sr = "synapse_sr.cli:main"

[tool.setuptools.dynamic]
version = {attr = "synapse_sr.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["synapse_sr*"]

[tool.setuptools.package-data]
"synapse_sr" = ["py.typed", "THIRD_PARTY_NOTICES"]
"synapse_sr.pretrained" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
