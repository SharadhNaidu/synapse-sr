[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-sr"
version = "0.1.0"
description = "SYNAPSE Pro: observation-consistent Sentinel-2 10 m to 2 m super-resolution"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Proprietary (see THIRD_PARTY_NOTICES for bundled third-party code)"}
dependencies = ["torch>=1.13", "numpy", "safetensors", "rasterio", "affine"]

[project.optional-dependencies]
cuda = ["mamba-ssm==1.1.1"]

[project.scripts]
synapse-sr = "synapse.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["synapse*"]

[tool.setuptools.package-data]
"synapse.pretrained" = ["*.json"]
"synapse" = ["THIRD_PARTY_NOTICES"]
